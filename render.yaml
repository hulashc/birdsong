# Render deployment config
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: birdsong-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BIRDSONG_DATA_PATH
        value: birdsong_data.json
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
    # Free-tier keep-alive: hit /health every 14 minutes
    # Add a cron job in Render dashboard pointing to /health
    autoDeploy: true
