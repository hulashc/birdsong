# Render deployment config
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: birdsong-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # PYTHONPATH=. ensures `import api` resolves from repo root on Render
    startCommand: PYTHONPATH=. uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BIRDSONG_DATA_PATH
        value: birdsong_data.json
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
    autoDeploy: true
